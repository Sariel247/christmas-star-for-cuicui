rcle at 76% 60%,var(--a) 0 5px,transparent 8px),radial-gradient(circle at 44% 72%,#fff 0 4px,transparent 7px);filter:drop-shadow(0 0 10px white)}.foreground{position:absolute;bottom:-4%;left:-5%;width:110%;height:24%;background:radial-gradient(ellipse at 50% 0%,#d7e8ff55,transparent 60%),linear-gradient(180deg,#182b4c,#070d1e 65%);border-radius:50% 50% 0 0;box-shadow:0 -15px 50px #a6caff22}.intro{position:fixed;z-index:5;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:28px;background:linear-gradient(180deg,#02040a20,#02040a55);transition:opacity 1.5s,transform 1.8s}.intro.off{opacity:0;transform:translateY(-18px) scale(1.04);pointer-events:none}.eyebrow{font:10px system-ui;letter-spacing:.55em;color:var(--c);margin-bottom:22px;text-shadow:0 0 18px var(--a)}h1{font-weight:400;font-size:clamp(30px,6.5vw,62px);letter-spacing:.16em;margin:0;color:#fffaf2;text-shadow:0 0 24px color-mix(in srgb,var(--a) 60%,transparent),0 0 80px color-mix(in srgb,var(--b) 45%,transparent)}.sub{font-size:clamp(12px,2.3vw,16px);letter-spacing:.22em;color:#e5e9f7c9;margin:22px 0 38px}.open{border:1px solid color-mix(in srgb,var(--c) 85%,white);border-radius:99px;padding:15px 38px;background:linear-gradient(120deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 18%,transparent));color:#fff;font:11px system-ui;letter-spacing:.35em;box-shadow:0 0 28px color-mix(in srgb,var(--a) 28%,transparent),inset 0 0 20px #fff2;cursor:pointer;transition:.3s}.open:active{transform:scale(.95)}.message{position:fixed;z-index:4;left:50%;bottom:max(7%,env(safe-area-inset-bottom));transform:translate(-50%,30px);width:min(88%,650px);text-align:center;opacity:0;transition:opacity 2s,transform 2s;pointer-events:none}.message.show{opacity:1;transform:translate(-50%,0)}.message .line{font-size:clamp(14px,2.6vw,19px);line-height:2.1;letter-spacing:.12em;color:#fff9e9;text-shadow:0 0 22px var(--a)}.message small{display:block;margin-top:18px;color:var(--c); const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');

let w,h,dpr,stars=[],shooters=[],snow=[];function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.25,Math.sqrt(900000/(w*h)));canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(500,Math.floor(w*h/1600))},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.8+.2,r:Math.random()*1.5+.3,p:Math.random()*7}));snow=Array.from({length:Math.min(160,Math.floor(w*h/4000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.4,v:Math.random()*1.1+.3,a:Math.random()*6}));}addEventListener('resize',resize);resize();let skyFrameAt=0,skyRequest=0,last=0,fireworks=[];function launchFirework(x,y){const hue=Math.random()*60+265;for(let i=0;i<45;i++){const a=Math.PI*2*i/45,v=1.2+Math.random()*5.2;fireworks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:55+Math.random()*30,max:85,hue,size:1+Math.random()*2.2})}}function frame(t){skyRequest=0;if(document.hidden)return;skyRequest=requestAnimationFrame(frame);if(t-skyFrameAt<1000/30-1)return;skyFrameAt=t;ctx.clearRect(0,0,w,h);for(const s of stars){let a=.25+.7*(.5+.5*Math.sin(t*.0008+s.p));ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.z,0,Math.PI*2);ctx.fill()}for(const f of snow){f.y+=f.v;f.x+=Math.sin(t*.0005+f.a)*.35;if(f.y>h+5){f.y=-5;f.x=Math.random()*w}ctx.fillStyle='rgba(230,241,255,.65)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}if(t-last>1700&&Math.random()<.035){last=t;shooters.push({x:Math.random()*w*.8,y:Math.random()*h*.42,vx:5+Math.random()*7,vy:3+Math.random()*4,l:0})}shooters=shooters.filter(s=>s.l<30);for(const s of shooters){ctx.strokeStyle='rgba(255,245,220,'+(1-s.l/30)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*5,s.y-s.vy*5);ctx.stroke();s.x+=s.vx;s.y+=s.vy;s.l++}for(let i=fireworks.length-1;i>=0;i--){const p=fireworks[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life--;ctx.globalCompositeOperation='lighter';ctx.fillStyle='hsla('+p.hue+',95%,78%,'+(p.life/p.max)+')';ctx.shadowBlur=8;ctx.shadowColor='hsla('+p.hue+',100%,75%,.9)';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)fireworks.splice(i,1)}ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;if(t-last>2200&&Math.random()<.018){last=t;launchFirework(Math.random()*w,Math.random()*h*.48)}}skyRequest=requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(skyRequest);skyRequest=0;}else if(!skyRequest){skyFrameAt=0;skyRequest=requestAnimationFrame(frame);}});
const world=document.getElementById('world'),intro=document.getElementById('intro'),message=document.getElementById('message'),burst=document.getElementById('burst');document.getElementById('open').addEventListener('click',()=>{world.classList.add('opened');launchFirework(w*.5,h*.34);setTimeout(()=>launchFirework(w*.28,h*.28),420);setTimeout(()=>launchFirework(w*.72,h*.25),850);burst.classList.remove('go');void burst.offsetWidth;burst.classList.add('go');intro.classList.add('off');setTimeout(()=>message.classList.add('show'),2100);for(let i=0;i<38;i++){const e=document.createElement('i');e.className='spark';e.textContent=['✦','✧','★','❄','·'][i%5];e.style.left=Math.random()*100+'%';e.style.top=Math.random()*80+'%';e.style.setProperty('--d',(2+Math.random()*4)+'s');e.style.fontSize=(10+Math.random()*20)+'px';world.appendChild(e)}});</script><script>
