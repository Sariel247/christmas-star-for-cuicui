<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050817"><meta name="description" content="给 xxp 的时光邮局 · Merry Christmas"><title>给 xxp 的时光邮局 · Merry Christmas</title>
<style>
:root{--a:#ffd58d;--b:#f4b6a0;--c:#fff0c9;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#fff}body{font-family:"Noto Serif SC","Songti SC",serif}#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}.world{position:fixed;inset:0;overflow:hidden;perspective:900px;background:radial-gradient(ellipse at 50% 65%,#263b62 0,#111a35 34%,#070b1b 72%,#03050d 100%)}.nebula{position:absolute;inset:-30%;background:radial-gradient(ellipse at 25% 35%,color-mix(in srgb,var(--a) 32%,transparent),transparent 25%),radial-gradient(ellipse at 75% 42%,color-mix(in srgb,var(--b) 28%,transparent),transparent 28%),radial-gradient(ellipse at 50% 80%,color-mix(in srgb,var(--c) 20%,transparent),transparent 35%);filter:blur(55px);animation:drift 18s ease-in-out infinite alternate}.aurora{position:absolute;left:-20%;right:-20%;top:8%;height:48%;opacity:.38;filter:blur(32px);background:linear-gradient(115deg,transparent 15%,color-mix(in srgb,var(--a) 38%,transparent),color-mix(in srgb,var(--b) 30%,transparent),transparent 80%);transform:rotate(-12deg);animation:aurora 13s ease-in-out infinite alternate}.moon{position:absolute;width:min(32vw,230px);aspect-ratio:1;border-radius:50%;right:12%;top:12%;background:radial-gradient(circle at 35% 32%,#fff 0,#fff8df 20%,color-mix(in srgb,var(--c) 65%,white) 48%,transparent 72%);filter:drop-shadow(0 0 35px var(--c)) drop-shadow(0 0 100px var(--a));opacity:.88;animation:float 8s ease-in-out infinite}.halo{position:absolute;width:min(78vw,650px);aspect-ratio:1;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:50%;right:-10%;top:-4%;transform:rotateX(72deg) rotateZ(-18deg);box-shadow:0 0 50px color-mix(in srgb,var(--a) 24%,transparent),inset 0 0 55px color-mix(in srgb,var(--b) 18%,transparent);animation:spin 70s linear infinite}.mountains{position:absolute;bottom:0;left:-10%;width:120%;height:42%;background:linear-gradient(160deg,transparent 0 18%,#263959 18.2% 19%,#101d39 19.2% 100%);clip-path:polygon(0 70%,12% 25%,21% 57%,36% 5%,49% 58%,62% 18%,75% 61%,88% 23%,100% 65%,100% 100%,0 100%);opacity:.72;filter:drop-shadow(0 -12px 28px color-mix(in srgb,var(--a) 22%,transparent))}.city{position:absolute;bottom:0;left:0;right:0;height:24%;background:linear-gradient(0deg,#050916 0%,#0c1730 70%,transparent);opacity:.94}.tree{position:absolute;bottom:10%;left:50%;width:min(55vw,440px);height:min(70vh,610px);transform:translateX(-50%);filter:drop-shadow(0 0 32px color-mix(in srgb,var(--a) 40%,transparent));}.tree:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,color-mix(in srgb,var(--a) 55%,white),#1b5a67 35%,#10264a 75%);clip-path:polygon(50% 0,58% 19%,73% 24%,62% 34%,83% 43%,67% 49%,94% 65%,63% 64%,78% 82%,55% 78%,50% 100%,45% 78%,22% 82%,37% 64%,6% 65%,33% 49%,17% 43%,38% 34%,27% 24%,42% 19%);opacity:.68;filter:drop-shadow(0 0 25px var(--a))}.tree:after{content:"";position:absolute;left:47%;bottom:-5%;width:6%;height:18%;background:linear-gradient(90deg,#4a2b24,#b47b4d,#40241e);border-radius:8px}.star-top{position:absolute;top:-6%;left:50%;transform:translateX(-50%);font-size:clamp(32px,6vw,64px);color:#fff8ce;text-shadow:0 0 14px white,0 0 35px var(--a),0 0 70px var(--c);animation:pulse 2.4s ease-in-out infinite}.garland{position:absolute;inset:10% 5% 18%;border:2px solid transparent;border-radius:50%;border-bottom-color:color-mix(in srgb,var(--c) 75%,white);transform:rotate(-18deg);filter:drop-shadow(0 0 8px var(--c));opacity:.85}.garland:after{content:"";position:absolute;inset:7% 3% 0;border-bottom:2px solid var(--a);border-radius:50%;transform:rotate(20deg)}.baubles{position:absolute;inset:12% 12% 20%;background:radial-gradient(circle at 50% 8%,#fff 0 3px,transparent 5px),radial-gradient(circle at 32% 25%,var(--a) 0 5px,transparent 8px),radial-gradient(circle at 66% 35%,var(--c) 0 5px,transparent 8px),radial-gradient(circle at 22% 52%,var(--b) 0 5px,transparent 8px),radial-gradient(circle at 76% 60%,var(--a) 0 5px,transparent 8px),radial-gradient(circle at 44% 72%,#fff 0 4px,transparent 7px);filter:drop-shadow(0 0 10px white)}.foreground{position:absolute;bottom:-4%;left:-5%;width:110%;height:24%;background:radial-gradient(ellipse at 50% 0%,#d7e8ff55,transparent 60%),linear-gradient(180deg,#182b4c,#070d1e 65%);border-radius:50% 50% 0 0;box-shadow:0 -15px 50px #a6caff22}.intro{position:fixed;z-index:5;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:28px;background:linear-gradient(180deg,#02040a20,#02040a55);transition:opacity 1.5s,transform 1.8s;backdrop-filter:blur(1px)}.intro.off{opacity:0;transform:translateY(-18px) scale(1.04);pointer-events:none}.eyebrow{font:10px system-ui;letter-spacing:.55em;color:var(--c);margin-bottom:22px;text-shadow:0 0 18px var(--a)}h1{font-weight:400;font-size:clamp(30px,6.5vw,62px);letter-spacing:.16em;margin:0;color:#fffaf2;text-shadow:0 0 24px color-mix(in srgb,var(--a) 60%,transparent),0 0 80px color-mix(in srgb,var(--b) 45%,transparent)}.sub{font-size:clamp(12px,2.3vw,16px);letter-spacing:.22em;color:#e5e9f7c9;margin:22px 0 38px}.open{border:1px solid color-mix(in srgb,var(--c) 85%,white);border-radius:99px;padding:15px 38px;background:linear-gradient(120deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 18%,transparent));color:#fff;font:11px system-ui;letter-spacing:.35em;box-shadow:0 0 28px color-mix(in srgb,var(--a) 28%,transparent),inset 0 0 20px #fff2;backdrop-filter:blur(12px);cursor:pointer;transition:.3s}.open:active{transform:scale(.95)}.message{position:fixed;z-index:4;left:50%;bottom:max(7%,env(safe-area-inset-bottom));transform:translate(-50%,30px);width:min(88%,650px);text-align:center;opacity:0;transition:opacity 2s,transform 2s;pointer-events:none}.message.show{opacity:1;transform:translate(-50%,0)}.message .line{font-size:clamp(14px,2.6vw,19px);line-height:2.1;letter-spacing:.12em;color:#fff9e9;text-shadow:0 0 22px var(--a)}.message small{display:block;margin-top:18px;color:var(--c);letter-spacing:.35em;font:10px system-ui}.top{position:fixed;z-index:3;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:9px system-ui;letter-spacing:.48em;color:#e8edff88}.burst{position:absolute;left:50%;top:47%;width:10px;height:10px;border-radius:50%;background:white;box-shadow:0 0 25px 10px var(--a),0 0 90px 35px var(--b);opacity:0;pointer-events:none}.burst.go{animation:burst 2.5s ease-out}.spark{position:absolute;color:var(--c);text-shadow:0 0 12px white,0 0 28px var(--a);animation:twinkle var(--d) ease-in-out infinite alternate;opacity:.8}.world.opened .moon{transform:scale(1.12);filter:drop-shadow(0 0 55px var(--c)) drop-shadow(0 0 150px var(--a))}.world.opened .aurora{opacity:.7}.world.opened .tree{animation:treeRise 4s cubic-bezier(.2,.8,.2,1) both}.world.opened .halo{animation-duration:24s}.world.opened .mountains{filter:drop-shadow(0 -18px 42px var(--a));opacity:1}
@keyframes drift{to{transform:translate3d(5%,-4%,0) scale(1.12)}}@keyframes aurora{to{transform:rotate(-4deg) translateY(8%);opacity:.65}}@keyframes float{50%{transform:translateY(-18px)}}@keyframes spin{to{transform:rotateX(72deg) rotateZ(342deg)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.18);filter:brightness(1.5)}}@keyframes twinkle{to{transform:translateY(-18px) rotate(40deg);opacity:.22}}@keyframes burst{0%{opacity:0;transform:scale(.1)}20%{opacity:1}100%{opacity:0;transform:scale(55)}}@keyframes treeRise{0%{transform:translateX(-50%) translateY(15%) scale(.78);filter:brightness(.5)}100%{transform:translateX(-50%) translateY(0) scale(1);filter:brightness(1.3) drop-shadow(0 0 55px var(--a))}}@media(max-width:600px){.moon{right:4%;top:14%;width:34vw}.tree{width:78vw;height:58vh;bottom:15%}.mountains{height:34%}.sub{line-height:1.9}.message{bottom:9%}}

/* DELUXE TIME POST TOWN */
.time-town{position:absolute;z-index:1;bottom:13%;left:50%;width:min(100vw,1100px);height:40%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 24px #f3c58a55)}
.time-town:before{content:"";position:absolute;bottom:0;left:5%;right:5%;height:65%;background:linear-gradient(180deg,#e8bd8c99,#80627a99 60%,#1a203b);clip-path:polygon(0 100%,0 35%,14% 35%,14% 8%,25% 8%,25% 35%,34% 35%,34% 0,50% 0,50% 35%,62% 35%,62% 12%,75% 12%,75% 35%,88% 35%,88% 5%,96% 5%,96% 35%,100% 35%,100% 100%);opacity:.62}
.time-town:after{content:"";position:absolute;left:35%;bottom:0;width:30%;height:45%;border:1px solid #ffe0aa88;border-bottom:0;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 100%,#ffdb9b44,transparent 68%);box-shadow:0 0 55px #f7c78c44}
.time-town i{position:absolute;bottom:28%;width:8%;height:30%;border:1px solid #ffe5bd88;background:linear-gradient(90deg,#5b4056,#eac48c,#72536b);clip-path:polygon(0 28%,50% 0,100% 28%,100% 100%,0 100%)}
.time-town i:after{content:"";position:absolute;inset:42% 30% 0;background:repeating-linear-gradient(90deg,#ffe4ad 0 3px,transparent 3px 9px)}
.time-town i:nth-child(1){left:13%}.time-town i:nth-child(2){left:46%;height:38%}.time-town i:nth-child(3){right:13%;height:34%}
.time-town b{position:absolute;left:50%;bottom:42%;width:1px;height:44%;background:#ffe5b8;box-shadow:0 0 14px #ffdfa7}
.letter-drift{position:absolute;z-index:2;inset:12% 6% 20%;pointer-events:none}
.letter-drift span{position:absolute;color:#ffe2b1;text-shadow:0 0 16px #ffd28c;font-size:clamp(18px,3vw,30px);animation:letterFloat 7s ease-in-out infinite alternate}
.letter-drift span:nth-child(1){left:12%;top:22%}.letter-drift span:nth-child(2){left:28%;top:5%;animation-delay:-2s}.letter-drift span:nth-child(3){right:12%;top:30%;animation-delay:-4s}.letter-drift span:nth-child(4){right:28%;top:4%;animation-delay:-1s}
.clock-halo{position:absolute;z-index:1;left:50%;top:19%;width:min(58vw,520px);aspect-ratio:1;transform:translateX(-50%);border:1px solid #ffe1ad55;border-radius:50%;box-shadow:0 0 40px #e9bd8255,inset 0 0 45px #e9bd8222;pointer-events:none}
.clock-halo:before,.clock-halo:after{content:"";position:absolute;inset:8%;border:1px dashed #ffe1ad55;border-radius:50%}
.clock-halo:after{inset:18%;border-style:solid;opacity:.5}
@keyframes letterFloat{to{transform:translate(12px,-20px) rotate(12deg);opacity:.5}}
.world.opened .time-town{filter:drop-shadow(0 0 45px #ffd79a99) brightness(1.25)}
.world.opened .clock-halo{animation:spin 22s linear infinite}

</style></head><body><div class="world" id="world"><canvas id="sky"></canvas><div class="nebula"></div><div class="aurora"></div><div class="halo"></div><div class="moon"></div><div class="mountains"></div><div class="city"></div><div class="tree"><div class="star-top">★</div><div class="garland"></div><div class="baubles"></div></div><div class="grand-architecture time-town"><i></i><i></i><i></i><b></b></div><div class="letter-drift"><span>✉</span><span>✧</span><span>✉</span><span>❧</span></div><div class="clock-halo"></div><div class="foreground"></div><div class="burst" id="burst"></div></div>
<div class="top">LETTERS THROUGH THE YEARS</div><section class="intro" id="intro"><div class="eyebrow">✦ MERRY CHRISTMAS ✦</div><h1>xxp</h1><p class="sub">有些陪伴，走过很久依然珍贵</p><button class="open" id="open">拆开这封信</button></section><section class="message" id="message"><div class="line">从小时候一路走到现在，时间改变了很多东西，还好我们依然是很好的朋友。愿新的一年，你的生活里总有温暖的灯火，也总有人与你分享快乐。</div><small>✦ 这封信没有邮戳，因为它一直都在路上。 ✦</small></section>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,dpr,stars=[],shooters=[],snow=[];function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/850)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.8+.2,r:Math.random()*1.5+.3,p:Math.random()*7}));snow=Array.from({length:Math.floor(w*h/1800)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.4,v:Math.random()*1.1+.3,a:Math.random()*6}));}addEventListener('resize',resize);resize();let last=0,fireworks=[];function launchFirework(x,y){const hue=Math.random()*35+25;for(let i=0;i<90;i++){const a=Math.PI*2*i/90,v=1.2+Math.random()*5.2;fireworks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:55+Math.random()*30,max:85,hue,size:1+Math.random()*2.2})}}function frame(t){ctx.clearRect(0,0,w,h);for(const s of stars){let a=.25+.7*(.5+.5*Math.sin(t*.0008+s.p));ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.z,0,Math.PI*2);ctx.fill()}for(const f of snow){f.y+=f.v;f.x+=Math.sin(t*.0005+f.a)*.35;if(f.y>h+5){f.y=-5;f.x=Math.random()*w}ctx.fillStyle='rgba(230,241,255,.65)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}if(t-last>1700&&Math.random()<.035){last=t;shooters.push({x:Math.random()*w*.8,y:Math.random()*h*.42,vx:5+Math.random()*7,vy:3+Math.random()*4,l:0})}shooters=shooters.filter(s=>s.l<30);for(const s of shooters){ctx.strokeStyle='rgba(255,245,220,'+(1-s.l/30)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*5,s.y-s.vy*5);ctx.stroke();s.x+=s.vx;s.y+=s.vy;s.l++}for(let i=fireworks.length-1;i>=0;i--){const p=fireworks[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life--;ctx.globalCompositeOperation='lighter';ctx.fillStyle='hsla('+p.hue+',95%,78%,'+(p.life/p.max)+')';ctx.shadowBlur=14;ctx.shadowColor='hsla('+p.hue+',100%,75%,.9)';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)fireworks.splice(i,1)}ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;if(t-last>2200&&Math.random()<.018){last=t;launchFirework(Math.random()*w,Math.random()*h*.48)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
const world=document.getElementById('world'),intro=document.getElementById('intro'),message=document.getElementById('message'),burst=document.getElementById('burst');document.getElementById('open').addEventListener('click',()=>{world.classList.add('opened');launchFirework(w*.5,h*.34);setTimeout(()=>launchFirework(w*.28,h*.28),420);setTimeout(()=>launchFirework(w*.72,h*.25),850);burst.classList.remove('go');void burst.offsetWidth;burst.classList.add('go');intro.classList.add('off');setTimeout(()=>message.classList.add('show'),2100);for(let i=0;i<38;i++){const e=document.createElement('i');e.className='spark';e.textContent=['✦','✧','★','❄','·'][i%5];e.style.left=Math.random()*100+'%';e.style.top=Math.random()*80+'%';e.style.setProperty('--d',(2+Math.random()*4)+'s');e.style.fontSize=(10+Math.random()*20)+'px';world.appendChild(e)}});</script></body></html>
