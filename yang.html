<style>

rcle at 76% 60%,var(--a) 0 5px,transparent 8px),radial-gradient(circle at 44% 72%,#fff 0 4px,transparent 7px);filter:drop-shadow(0 0 10px white)}.foreground{position:absolute;bottom:-4%;left:-5%;width:110%;height:24%;background:radial-gradient(ellipse at 50% 0%,#d7e8ff55,transparent 60%),linear-gradient(180deg,#182b4c,#070d1e 65%);border-radius:50% 50% 0 0;box-shadow:0 -15px 50px #a6caff22}.intro{position:fixed;z-index:5;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:28px;background:linear-gradient(180deg,#02040a20,#02040a55);transition:opacity 1.5s,transform 1.8s;backdrop-filter:blur(1px)}.intro.off{opacity:0;transform:translateY(-18px) scale(1.04);pointer-events:none}.eyebrow{font:10px system-ui;letter-spacing:.55em;color:var(--c);margin-bottom:22px;text-shadow:0 0 18px var(--a)}h1{font-weight:400;font-size:clamp(30px,6.5vw,62px);letter-spacing:.16em;margin:0;color:#fffaf2;text-shadow:0 0 24px color-mix(in srgb,var(--a) 60%,transparent),0 0 80px color-mix(in srgb,var(--b) 45%,transparent)}.sub{font-size:clamp(12px,2.3vw,16px);letter-spacing:.22em;color:#e5e9f7c9;margin:22px 0 38px}.open{border:1px solid color-mix(in srgb,var(--c) 85%,white);border-radius:99px;padding:15px 38px;background:linear-gradient(120deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 18%,transparent));color:#fff;font:11px system-ui;letter-spacing:.35em;box-shadow:0 0 28px color-mix(in srgb,var(--a) 28%,transparent),inset 0 0 20px #fff2;backdrop-filter:blur(12px);cursor:pointer;transition:.3s}.open:active{transform:scale(.95)}.message{position:fixed;z-index:4;left:50%;bottom:max(7%,env(safe-area-inset-bottom));transform:translate(-50%,30px);width:min(88%,650px);text-align:center;opacity:0;transition:opacity 2s,transform 2s;pointer-events:none}.message.show{opacity:1;transform:translate(-50%,0)}.message .line{font-size:clamp(14px,2.6vw,19px);line-height:2.1;letter-spacing:.12em;color:#fff9e9;text-shadow:0 0 22px var(--a)}.messag <div class="top">BENEATH THE QUIET STARS</div><section class="intro" id="intro"><div class="eyebrow">✦ MERRY CHRISTMAS ✦</div><h1>🐑</h1><p class="sub">愿所有温柔，都在不经意间抵达</p><button class="open" id="open">点亮月光</button></section><section class="message" id="message"><div class="line">愿你在自己的节奏里自在生活。即使偶尔沉默，也希望你总能遇见值得期待的风景，和悄悄落在身边的温柔。</div><small>✦ 愿月光替星星，向你说一声晚安。 ✦</small></section>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');

/* Particle tree: gather once, then shimmer continuously */
(()=>{
 const el=document.getElementById('treeCanvas'); if(!el)return;
 const c=el.getContext('2d'); let W=0,H=0,D=1,parts=[],started=false,startAt=0;
 const palette=[185,220,201,228,217];
 const rand=(a,b)=>a+Math.random()*(b-a);
 function resizeTree(){
  const r=el.getBoundingClientRect(); W=Math.max(1,r.width);H=Math.max(1,r.height);D=Math.min(devicePixelRatio||1,2);
  el.width=Math.round(W*D);el.height=Math.round(H*D);c.setTransform(D,0,0,D,0,0);
  parts=[];
  const count=Math.min(760,Math.max(420,Math.floor(W*H/390)));
  for(let i=0;i<count;i++){
   const t=Math.random()*.98+.01, strand=i%5, a=t*(Math.PI*2*(7.5+strand*.55))+strand*1.25+rand(-.12,.12);
   const radius=(.035+.43*t)*Math.min(W,H*.76);
   const tx=W/2+Math.cos(a)*radius, ty=H*(.08+.79*t);
   parts.push({x:rand(W*.35,W*.65),y:rand(H*.05,H*.92),tx,ty,
    size:rand(.65,2.05),phase:rand(0,Math.PI*2),speed:rand(.7,2.2),
    hue:palette[Math.floor(Math.random()*palette.length)],alpha:rand(.48,.96),delay:rand(0,.58)});
  }
 }
 addEventListener('resize',resizeTree);resizeTree();
 function draw(now){
  c.clearRect(0,0,W,H);
  if(started){
   const progress=Math.min(1,(now-startAt)/3600);
   const ease=1-Math.pow(1-progress,3);
   c.save();c.globalCompositeOperation='lighter';
   for(const p of parts){
    const local=Math.max(0,Math.min(1,(progress-p.delay)/(1-p.delay)));
    const e=1-Math.pow(1-local,3);
    const x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e;
    const tw=.58+.42*Math.sin(now*.002*p.speed+p.phase);
    const alpha=p.alpha*(local<1?Math.max(.1,local):tw);
    c.beginPath();c.fillStyle='hsla('+p.hue+',92%, '+(72+tw*18)+'%,'+alpha+')';
    c.shadowBlur=5+tw*11;c.shadowColor='hsla('+p.hue+',100%,78%,.9)';
    c.arc(x,y,p.size*(.8+tw*.45),0,Math.PI*2);c.fill();
   }
   // Fine spiral filaments that make the tree read as a single luminous form.
   if(progress>.72){
    const a=(progress-.72)/.28;
    for(let strand=0;strand<3;strand++){
     c.beginPath();
     for(let j=0;j<=180;j++){
      const t=j/180,ang=t*Math.PI*2*8+strand*2.1+now*.00012;
      const rr=(.035+.43*t)*Math.min(W,H*.76);
      const x=W/2+Math.cos(ang)*rr,y=H*(.08+.79*t);
      if(j===0)c.moveTo(x,y);else c.lineTo(x,y);
     }
     c.strokeStyle='rgba(184,220,255,'+(.12*a)+')';c.lineWidth=1.1;c.shadowBlur=12;c.shadowColor='rgba(184,220,255,.8)';c.stroke();
    }
   }
   // Star at the crown
   const pulse=.7+.3*Math.sin(now*.003);
   c.globalAlpha=Math.min(1,progress)*pulse;
   c.shadowBlur=28;c.shadowColor='237,246,255';c.fillStyle='237,246,255';
   c.beginPath();c.arc(W/2,H*.075,2.2+2*pulse,0,Math.PI*2);c.fill();
   for(let k=0;k<8;k++){const a=k*Math.PI/4+now*.0002;c.beginPath();c.moveTo(W/2+Math.cos(a)*7,H*.075+Math.sin(a)*7);c.lineTo(W/2+Math.cos(a)*19*pulse,H*.075+Math.sin(a)*19*pulse);c.strokeStyle='rgba(184,220,255,.62)';c.lineWidth=1;c.stroke()}
   // Floating circular footlight
   c.globalAlpha=.42+.18*Math.sin(now*.0015);c.beginPath();c.ellipse(W/2,H*.91,W*.31,H*.025,0,0,Math.PI*2);c.strokeStyle='rgba(184,220,255,.72)';c.lineWidth=1.2;c.shadowBlur=16;c.shadowColor='rgba(184,220,255,.9)';c.stroke();
   c.restore();
  }
  requestAnimationFrame(draw);
 }
 requestAnimationFrame(draw);
 window.startParticleTree=()=>{if(started)return;started=true;startAt=performance.now()};
 const open=document.getElementById('open');if(open)open.addEventListener('click',()=>setTimeout(()=>window.startParticleTree(),180),{once:true});
})();
let w,h,dpr,stars=[],shooters=[],snow=[];function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/850)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.8+.2,r:Math.random()*1.5+.3,p:Math.random()*7}));snow=Array.from({length:Math.floor(w*h/1800)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.4,v:Math.random()*1.1+.3,a:Math.random()*6}));}addEventListener('resize',resize);resize();let last=0,fireworks=[];function launchFirework(x,y){const hue=Math.random()*55+185;for(let i=0;i<90;i++){const a=Math.PI*2*i/90,v=1.2+Math.random()*5.2;fireworks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:55+Math.random()*30,max:85,hue,size:1+Math.random()*2.2})}}function frame(t){ctx.clearRect(0,0,w,h);for(const s of stars){let a=.25+.7*(.5+.5*Math.sin(t*.0008+s.p));ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.z,0,Math.PI*2);ctx.fill()}for(const f of snow){f.y+=f.v;f.x+=Math.sin(t*.0005+f.a)*.35;if(f.y>h+5){f.y=-5;f.x=Math.random()*w}ctx.fillStyle='rgba(230,241,255,.65)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}if(t-last>1700&&Math.random()<.035){last=t;shooters.push({x:Math.random()*w*.8,y:Math.random()*h*.42,vx:5+Math.random()*7,vy:3+Math.random()*4,l:0})}shooters=shooters.filter(s=>s.l<30);for(const s of shooters){ctx.strokeStyle='rgba(255,245,220,'+(1-s.l/30)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*5,s.y-s.vy*5);ctx.stroke();s.x+=s.vx;s.y+=s.vy;s.l++}for(let i=fireworks.length-1;i>=0;i--){const p=fireworks[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life--;ctx.globalCompositeOperation='lighter';ctx.fillStyle='hsla('+p.hue+',95%,78%,'+(p.life/p.max)+')';ctx.shadowBlur=14;ctx.shadowColor='hsla('+p.hue+',100%,75%,.9)';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)fireworks.splice(i,1)}ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;if(t-last>2200&&Math.random()<.018){last=t;launchFirework(Math.random()*w,Math.random()*h*.48)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
const world=document.getElementById('world'),intro=document.getElementById('intro'),message=document.getElementById('message'),burst=document.getElementById('burst');document.getElementById('open').addEventListener('click',()=>{world.classList.add('opened');launchFirework(w*.5,h*.34);setTimeout(()=>launchFirework(w*.28,h*.28),420);setTimeout(()=>launchFirework(w*.72,h*.25),850);burst.classList.remove('go');void burst.offsetWidth;burst.classList.add('go');intro.classList.add('off');setTimeout(()=>message.classList.add('show'),2100);for(let i=0;i<38;i++){const e=document.createElement('i');e.className='spark';e.textContent=['✦','✧','★','❄','·'][i%5];e.style.left=Math.random()*100+'%';e.style.top=Math.random()*80+'%';e.style.setProperty('--d',(2+Math.random()*4)+'s');e.style.fontSize=(10+Math.random()*20)+'px';world.appendChild(e)}});</script></body></html>
